apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: docdock-ingress
  namespace: docdock
  labels:
    app.kubernetes.io/name: docdock
  annotations:
    # NGINX Ingress Controller annotations
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # WebSocket support for Socket.IO
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upgrade: websocket
    nginx.ingress.kubernetes.io/connection: Upgrade
    # Rewrite rules
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: docdock.example.com  # Replace with your actual domain
      http:
        paths:
          # API routes — all /api/* and Socket.IO connections
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: docdock-backend
                port:
                  number: 4000
          # Socket.IO uses /socket.io path
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: docdock-backend
                port:
                  number: 4000
          # Frontend — all other routes
          - path: /
            pathType: Prefix
            backend:
              service:
                name: docdock-frontend
                port:
                  number: 3000
  # Uncomment and configure TLS for HTTPS:
  # tls:
  #   - hosts:
  #       - docdock.example.com
  #     secretName: docdock-tls-secret
