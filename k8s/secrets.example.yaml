# ===========================================================================
# DocDock Kubernetes Secrets — EXAMPLE FILE
# ===========================================================================
# DO NOT commit this file with real values.
# This is a template showing the structure of required secrets.
#
# To create secrets in your cluster:
#
# Option A: Manually create from this template
#   1. Copy this file to secrets.yaml (gitignored)
#   2. Base64-encode your values: echo -n 'your-value' | base64
#   3. Replace placeholder values below
#   4. kubectl apply -f k8s/secrets.yaml
#
# Option B: Use kubectl create secret (recommended)
#   kubectl create secret generic docdock-secrets \
#     --namespace=docdock \
#     --from-literal=MONGODB_URI='mongodb+srv://...' \
#     --from-literal=REDIS_URL='rediss://...' \
#     --from-literal=JWT_ACCESS_SECRET='...' \
#     --from-literal=JWT_REFRESH_SECRET='...' \
#     --from-literal=COOKIE_SECRET='...' \
#     --from-literal=KAFKA_BROKERS='broker.confluent.cloud:9092' \
#     --from-literal=KAFKA_SASL_USERNAME='...' \
#     --from-literal=KAFKA_SASL_PASSWORD='...'
#
# Option C: Use External Secrets Operator with AWS Secrets Manager / Vault
#   (recommended for production teams)
# ===========================================================================

apiVersion: v1
kind: Secret
metadata:
  name: docdock-secrets
  namespace: docdock
  labels:
    app.kubernetes.io/name: docdock
type: Opaque
data:
  # ---------------------------------------------------------------------------
  # Database (base64-encoded)
  # echo -n 'mongodb+srv://user:pass@cluster.mongodb.net/docdock' | base64
  # ---------------------------------------------------------------------------
  MONGODB_URI: REPLACE_WITH_BASE64_ENCODED_VALUE

  # ---------------------------------------------------------------------------
  # Redis (base64-encoded)
  # echo -n 'rediss://user:token@host.upstash.io:6380' | base64
  # ---------------------------------------------------------------------------
  REDIS_URL: REPLACE_WITH_BASE64_ENCODED_VALUE

  # ---------------------------------------------------------------------------
  # JWT secrets (minimum 32 characters, base64-encoded)
  # ---------------------------------------------------------------------------
  JWT_ACCESS_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE
  JWT_REFRESH_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE
  COOKIE_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE

  # ---------------------------------------------------------------------------
  # Kafka (base64-encoded)
  # ---------------------------------------------------------------------------
  KAFKA_BROKERS: REPLACE_WITH_BASE64_ENCODED_VALUE
  KAFKA_SASL_USERNAME: REPLACE_WITH_BASE64_ENCODED_VALUE
  KAFKA_SASL_PASSWORD: REPLACE_WITH_BASE64_ENCODED_VALUE

  # ---------------------------------------------------------------------------
  # Application URLs (base64-encoded)
  # ---------------------------------------------------------------------------
  APP_URL: REPLACE_WITH_BASE64_ENCODED_VALUE
  BACKEND_URL: REPLACE_WITH_BASE64_ENCODED_VALUE
  NEXT_PUBLIC_API_URL: REPLACE_WITH_BASE64_ENCODED_VALUE
  NEXT_PUBLIC_APP_URL: REPLACE_WITH_BASE64_ENCODED_VALUE
  NEXT_PUBLIC_SOCKET_URL: REPLACE_WITH_BASE64_ENCODED_VALUE

  # ---------------------------------------------------------------------------
  # Optional services (leave as empty string if not used)
  # echo -n '' | base64 → ""
  # ---------------------------------------------------------------------------
  CLOUDINARY_CLOUD_NAME: REPLACE_WITH_BASE64_ENCODED_VALUE
  CLOUDINARY_API_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
  CLOUDINARY_API_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE
  RAZORPAY_KEY_ID: REPLACE_WITH_BASE64_ENCODED_VALUE
  RAZORPAY_KEY_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE
  NEXT_PUBLIC_RAZORPAY_KEY_ID: REPLACE_WITH_BASE64_ENCODED_VALUE
  SENDGRID_API_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
  GOOGLE_CLIENT_ID: REPLACE_WITH_BASE64_ENCODED_VALUE
  GOOGLE_CLIENT_SECRET: REPLACE_WITH_BASE64_ENCODED_VALUE
  TWILIO_ACCOUNT_SID: REPLACE_WITH_BASE64_ENCODED_VALUE
  TWILIO_AUTH_TOKEN: REPLACE_WITH_BASE64_ENCODED_VALUE
  TWILIO_PHONE_NUMBER: REPLACE_WITH_BASE64_ENCODED_VALUE
  GEMINI_API_KEY: REPLACE_WITH_BASE64_ENCODED_VALUE
