# ---------------------------------------------------------------------------
# Development Compose Override
#
# Starts Kafka locally so developers can run the API in hot-reload mode:
#
#   docker compose -f docker-compose.dev.yml up -d
#   npm run dev
#
# MongoDB Atlas and Upstash Redis are used as cloud services.
# Only Kafka needs a local Docker container for development.
#
# Listener architecture for host-running Node.js (npm run dev):
#   - EXTERNAL listener on container port 9094, mapped to host port 9092
#   - KAFKA_BROKERS=localhost:9092 in .env connects via EXTERNAL
#   - PLAINTEXT listener on container port 9092 for container-to-container
#   - CONTROLLER listener on container port 9093 (KRaft only)
# ---------------------------------------------------------------------------

services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode — no Zookeeper)
  # Single-broker development setup using the official Apache Kafka image
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: docdock-kafka
    restart: unless-stopped
    ports:
      # Host port 9092 → container EXTERNAL listener on 9094
      # Node.js running on host connects via localhost:9092
      - "9092:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # Three listeners:
      #   CONTROLLER: KRaft internal only (port 9093)
      #   PLAINTEXT:  container-to-container (port 9092)
      #   EXTERNAL:   host → container (port 9094, mapped to host 9092)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Cluster/replication settings for single-broker dev
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Let KafkaJS auto-create topics (admin.ts also creates them explicitly)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1

      # KRaft cluster UUID — fixed value so it survives container restarts
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    volumes:
      - kafka_dev_data:/var/lib/kafka/data
    healthcheck:
      # The official apache/kafka image ships scripts under /opt/kafka/bin/
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Kafka UI (development only)
  # Access at http://localhost:8080 to inspect topics and messages
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: docdock-kafka-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: docdock-local
      # kafka-ui is container-to-container, use PLAINTEXT listener
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  kafka_dev_data:
