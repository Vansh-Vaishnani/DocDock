name: DocDock Docker Build & Push

on:
  push:
    branches: [main, master]
    paths:
      - "apps/**"
      - "packages/**"
      - "*.json"
      - "docker-compose*.yml"
      - ".github/workflows/docker.yml"

env:
  REGISTRY: ghcr.io
  # NOTE: these use github.repository_owner which preserves case (e.g. Vansh-Vaishnani).
  # docker/metadata-action normalises to lowercase when pushing, so the image in GHCR is
  # always lowercase. Trivy refs must also be lowercase — see trivy-scan job below.
  API_IMAGE_NAME: ${{ github.repository_owner }}/docdock-api
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/docdock-web

jobs:
  # ---------------------------------------------------------------------------
  # Build and push API Docker image to GitHub Container Registry
  # ---------------------------------------------------------------------------
  build-and-push-api:
    name: 🐳 Build & Push API Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # Pass the exact image tag used so the scan job doesn't re-derive it
      image: ${{ steps.meta-api.outputs.tags && 'ghcr.io/' || '' }}${{ env.API_IMAGE_NAME }}:latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Build and push Web Docker image
  # ---------------------------------------------------------------------------
  build-and-push-web:
    name: 🐳 Build & Push Web Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.docdock.example.com/api/v1
            NEXT_PUBLIC_APP_URL=https://docdock.example.com
            NEXT_PUBLIC_SOCKET_URL=https://api.docdock.example.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Trivy vulnerability scan on pushed images
  # Must authenticate to GHCR to pull private images before scanning.
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: 🔒 Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-and-push-api, build-and-push-web]
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      # GHCR login is required — without it Trivy cannot pull private images
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI image refs must be fully lowercase.
      # github.repository_owner preserves original casing (Vansh-Vaishnani),
      # but GHCR stores the image as vansh-vaishnani (lowercase).
      # docker/metadata-action handles this automatically during push,
      # but Trivy builds the ref directly — so we must lowercase it explicitly.
      - name: Compute lowercase image references
        run: |
          echo "API_IMAGE_REF=$(echo '${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "WEB_IMAGE_REF=$(echo '${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:latest' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Scan API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.API_IMAGE_REF }}
          format: sarif
          output: trivy-results-api.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload API Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results-api.sarif') != ''
        with:
          sarif_file: trivy-results-api.sarif
          category: trivy-api

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.WEB_IMAGE_REF }}
          format: sarif
          output: trivy-results-web.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Web Scan Results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-results-web.sarif') != ''
        with:
          sarif_file: trivy-results-web.sarif
          category: trivy-web
