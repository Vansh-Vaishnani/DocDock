name: DocDock CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint + TypeScript type checking
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: 🛡️ ESLint & TypeScript Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Workspace Linting
        run: npm run lint

      - name: Build Shared Package (type check prerequisite)
        run: npm run build --workspace=packages/shared

      - name: TypeScript Type Check — API
        run: npx tsc --noEmit --project apps/api/tsconfig.json

      - name: TypeScript Type Check — Web
        run: npx tsc --noEmit --project apps/web/tsconfig.json

  # ---------------------------------------------------------------------------
  # Job 2: API unit + integration tests
  # ---------------------------------------------------------------------------
  api-tests:
    name: 🧪 API Unit & Integration Tests
    runs-on: ubuntu-latest
    env:
      # Minimal env for test runner — no real credentials needed
      NODE_ENV: test
      PORT: "5000"
      MONGODB_URI: mongodb://localhost:27017/docdock_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: test_jwt_access_secret_32_characters_minimum
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_32_characters_minimum
      COOKIE_SECRET: test_cookie_secret_32_characters_minimum
      # Kafka intentionally not configured — consumers/producers gracefully disabled in tests
      KAFKA_BROKERS: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=packages/shared

      - name: Run API Tests with Coverage
        run: npx vitest run --project=apps/api --coverage
        working-directory: apps/api

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: apps/api/coverage/

  # ---------------------------------------------------------------------------
  # Job 3: Frontend component tests
  # ---------------------------------------------------------------------------
  web-tests:
    name: ⚛️ Next.js Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Web Vitest Suite
        run: npx vitest run
        working-directory: apps/web

  # ---------------------------------------------------------------------------
  # Job 4: Build verification (API + Web)
  # ---------------------------------------------------------------------------
  build:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Minimal vars needed for Next.js build
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SOCKET_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build All Workspaces
        run: npm run build

  # ---------------------------------------------------------------------------
  # Job 5: Docker image build verification (no push on PR)
  # ---------------------------------------------------------------------------
  docker-build:
    name: 🐳 Docker Image Build Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: docdock-api:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web Image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: docdock-web:ci-check
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 6: Dependency security scan
  # ---------------------------------------------------------------------------
  security-scan:
    name: 🔒 Dependency Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: npm Audit (High+ only, non-blocking)
        run: npm audit --audit-level=high || true
        # Non-blocking — reports vulnerabilities but doesn't fail the pipeline
        # Change || true to fail the build when vulnerabilities must be zero-tolerance

  # ---------------------------------------------------------------------------
  # Job 7: Docker image vulnerability scan (on main branch merges only)
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: 🛡️ Docker Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image for Scan
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: docdock-api:scan
          load: true

      - name: Trivy Vulnerability Scan — API Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: docdock-api:scan
          format: table
          exit-code: "0"
          # Change exit-code to "1" to block on CRITICAL vulnerabilities
          severity: HIGH,CRITICAL
